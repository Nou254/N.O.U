# N.O.U Digital Systems - production nginx entry point.
# Load-balances across N backend replicas (least_conn), serves the PWA frontend,
# rate-limits abusive clients, and adds security headers.

# Upstream pool of backend API replicas. Scale the backend service and this
# list together (e.g. docker-compose --scale backend=3 + backend_1..backend_N).
upstream nou_backend {
    least_conn;                       # send work to the least-loaded replica
    keepalive 32;                     # keep persistent upstream connections

    server backend:8000 max_fails=3 fail_timeout=30s;
    # server backend:8001 max_fails=3 fail_timeout=30s;
    # server backend:8002 max_fails=3 fail_timeout=30s;
}

# Limit request rate per client IP: 30 req/s burst 60 (high-traffic control).
limit_req_zone $binary_remote_addr zone=nou_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=nou_login:10m rate=10r/m;

# Map to add HSTS only over HTTPS.
map $scheme $hsts_header {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 80;
    listen 443 ssl;
    server_name nou.com www.nou.com;

    # SSL (place certificates in deployment/nginx/ssl)
    ssl_certificate     /etc/nginx/ssl/nou.crt;
    ssl_certificate_key /etc/nginx/ssl/nou.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security $hsts_header always;

    # Gzip compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Uploads cap (10 MB files)
    client_max_body_size 12m;

    # Cache immutable static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker must never be cached (PWA updates).
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API: rate-limited, load-balanced across replicas, active health checks.
    location /api {
        limit_req zone=nou_api burst=60 nodelay;

        proxy_pass http://nou_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tighter timeouts than default so a hung replica is retried fast.
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        # Active health checks (nginx plus).
        health_check interval=5s fails=3 passes=2 uri=/health;
    }

    # Assessment start/submit calls Groq for question generation and AI
    # grading, which routinely take 1-3+ minutes - far longer than the
    # default API read timeout. Give these endpoints a 15-minute window so
    # applicants are never cut off mid-generation (frontend axios matches).
    # Admin question-bank generation (100 questions per career) and CV AI
    # review take the same amount of time.
    location ~ ^/api/v1/(assessments/.*/(start|submit)|admin/question-bank/generate/|admin/cv/.*/review) {
        proxy_pass http://nou_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Login/OTP endpoints get a stricter per-IP limit (brute force).
    location ~ ^/api/v1/auth/(login|register|forgot-password|resend-otp) {
        limit_req zone=nou_login burst=5 nodelay;

        proxy_pass http://nou_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
