services:
  # ── Backend API ────────────────────────────────────────────────
  - type: web
    name: nou-backend
    runtime: python
    region: frankfurt           # closest to Kenya / East Africa
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false              # paste your TiDB / PlanetScale URL
      - key: CORS_ORIGINS
        sync: false              # paste your frontend URL
      - key: NOU_ADMIN_EMAIL
        sync: false
      - key: NOU_ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAILS_FROM_EMAIL
        sync: false
      - key: EMAILS_FROM_NAME
        value: "N.O.U Digital Systems"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: GROQ_ASSESSMENT_KEYS
        sync: false
      - key: GROQ_CHATBOT_KEYS
        sync: false
      - key: GROQ_COMMUNITY_KEYS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false              # paste your frontend URL

  # ── Frontend (static React SPA) ──────────────────────────────
  - type: web
    name: nou-frontend
    runtime: static
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
